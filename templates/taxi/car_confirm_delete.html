{% extends "base.html" %}

{% block content %}
  <h2>Car Delete Page</h2>
  <p><a>By deleting this car, you will lose all pointed information! Are you sure?</a></p>
  <form method="post" action="">
    {% csrf_token %}
    <input type="submit" class="btn btn-danger" value="Yes, delete this car">
    <a href="{% url 'taxi:car-list'}" class="btn btn-secondary">Cancel</a>
  </form>

{% endblock %}
